name: tests
on:
  push:
  pull_request:
jobs:
  offline:
    # Engines are faked in the tests, so no Codex or Claude login is needed.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: bin/axp roles && bin/axp install --claude-dir "$RUNNER_TEMP/claude" --codex-dir "$RUNNER_TEMP/codex" --codex-rules
